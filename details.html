<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Detailed information for a USGS earthquake event." />
    <title>Earthquake details</title>
    <script>document.documentElement.dataset.theme=localStorage.getItem("earthquakes-theme")||((matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light")</script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ3ynhtL5S9/Me8BTSbKJQNN4Z2Z7kI=" crossorigin="" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header"><a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">⌁</span><span>Earthquakes</span></a><nav class="header-actions" aria-label="Primary navigation"><a class="nav-link" href="index.html">List</a><a class="nav-link" href="map.html">Map</a><button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme"><span data-theme-icon aria-hidden="true">◐</span><span class="theme-label" data-theme-label>Theme</span></button></nav></header>
    <main id="main-content" class="page-shell detail-shell">
      <a class="back-link" href="index.html"><span aria-hidden="true">←</span> Back to recent events</a>
      <div id="status" class="status-panel" role="status"><span class="loader" aria-hidden="true"></span><p>Loading event details…</p></div>
      <article id="detail-content" hidden>
        <header class="detail-header"><div><p class="eyebrow" id="event-id">USGS EVENT</p><h1 id="earthquake-location"></h1><p id="earthquake-time" class="detail-time"></p></div><span id="magnitude-badge" class="magnitude-badge"></span></header>
        <dl class="metric-grid"><div><dt>Magnitude</dt><dd id="earthquake-magnitude"></dd></div><div><dt>Depth</dt><dd id="earthquake-depth"></dd></div><div><dt>Coordinates</dt><dd id="earthquake-coordinates"></dd></div><div><dt>Tsunami warning</dt><dd id="earthquake-tsunami"></dd></div></dl>
        <section class="map-panel detail-map"><div id="map" aria-label="Earthquake epicenter map"></div></section>
        <div class="detail-actions"><a id="usgs-link" class="button primary" target="_blank" rel="noopener noreferrer">View official USGS record <span aria-hidden="true">↗</span></a><button id="share-button" class="button secondary" type="button">Copy share link</button><span id="share-feedback" role="status"></span></div>
      </article>
    </main>
    <footer class="site-footer"><p>© <span data-current-year></span> Emre Karayaman. All rights reserved.</p><p>Earthquake data provided by the <a href="https://earthquake.usgs.gov/" target="_blank" rel="noopener noreferrer">U.S. Geological Survey (USGS)</a>.</p></footer>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script type="module" src="js/details-page.js"></script>
  </body>
</html>
